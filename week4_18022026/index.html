<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>vibeTix — Premium Booking</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0a0f1c, #111827);
      color: #ffffff;
    }

    h1, h4 {
      color: #00e5ff;
    }

    .card-custom {
      background: #1f2937;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .form-control {
      background: #111827;
      border: 1px solid #374151;
      color: white;
    }

    .form-control::placeholder {
      color: #9ca3af;
    }

    .form-control:focus {
      background: #111827;
      color: white;
      border-color: #00e5ff;
      box-shadow: none;
    }

    .btn-custom {
      background: linear-gradient(45deg, #00e5ff, #0077ff);
      border: none;
      font-weight: 600;
    }

    .btn-custom:hover {
      opacity: 0.9;
    }

    .poster {
      max-width: 180px;
      border-radius: 15px;
    }

    .output-box {
      background: #020617;
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
      color: #00ffcc;
    }
  </style>
</head>

<body>

<!-- HEADER -->
<div class="container text-center my-4">
  <h1 class="fw-bold">🎟 vibeTix</h1>
  <p class="text-light">Book Premium Events Instantly</p>
</div>

<!-- POSTER -->
<div class="container text-center mb-4">
  <img src="https://i.pinimg.com/1200x/0c/f6/8f/0cf68f435e83ea0376f0b21c1273f37d.jpg"
       class="poster shadow">
</div>

<!-- BOOKING FORM -->
<div class="container">
  <div class="card-custom p-4 mx-auto" style="max-width:420px;">

    <h4 class="text-center mb-3">🚀 Book Tickets</h4>

    <form onsubmit="handleBooking(event)">
      <input id="name" class="form-control mb-2" placeholder="Your Name">
      <input id="email" class="form-control mb-2" placeholder="Email">

      <select id="event" class="form-control mb-2" onchange="showPrice()">
        <option value="">Select Event</option>
        <option value="Concert">🎵 Concert</option>
        <option value="DJ">🎧 DJ Night</option>
        <option value="Fest">🎓 College Fest</option>
      </select>

      <p id="price" class="text-info small mb-2"></p>

      <input id="tickets" type="number" class="form-control mb-3" placeholder="Tickets">

      <button class="btn btn-custom w-100">Confirm Booking 🔥</button>
    </form>

    <div id="output" class="output-box"></div>

  </div>
</div>

<!-- FOOTER -->
<div class="container text-center mt-5">
  <p class="text-secondary">© 2026 vibeTix • Premium Experience</p>
</div>

<!-- JAVASCRIPT -->
<script>

// Variables
let eventPrices = {
  Concert: 1000,
  DJ: 800,
  Fest: 500
};

// Object
let system = {
  currency: "₹"
};

// Class
class Booking {
  constructor(name, event, tickets) {
    this.name = name;
    this.event = event;
    this.tickets = tickets;
  }

  total() {
    return eventPrices[this.event] * this.tickets;
  }
}

// Show price dynamically
function showPrice() {
  let event = document.getElementById("event").value;
  let priceText = event ? "Price per ticket: ₹" + eventPrices[event] : "";
  document.getElementById("price").innerHTML = priceText;
}

// Main function
function handleBooking(e) {
  e.preventDefault();

  let name = document.getElementById("name").value;
  let event = document.getElementById("event").value;
  let tickets = parseInt(document.getElementById("tickets").value);

  // Condition
  if (name === "" || event === "" || isNaN(tickets)) {
    document.getElementById("output").innerHTML = "⚠️ Please fill all fields properly!";
    return;
  }

  let user = new Booking(name, event, tickets);

  let message = `✅ Booking Confirmed for <b>${name}</b><br>`;

  // Loop
  for (let i = 1; i <= tickets; i++) {
    message += `🎟 Ticket ${i} - ${event}<br>`;
  }

  message += `<br>💰 Total: ${system.currency}${user.total()}`;

  document.getElementById("output").innerHTML = message;

  // Extra feature
  alert("Booking Successful 🎉");
}

</script>

</body>
</html>
